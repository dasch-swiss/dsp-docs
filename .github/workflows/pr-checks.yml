name: pr-checks

on:
  push:
    branches-ignore:
      - main

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
      - name: Authenticate with GitHub
        env:
          GH_PAT: ${{ secrets.DASCHBOT_PAT }}
        run: |
          echo "https://${GH_PAT}:@github.com" > ~/.git-credentials
          git config --global credential.helper store
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # necessary for git-revision-date-localized-plugin
          submodules: 'recursive'
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: sudo apt-get install graphviz
      - name: build graphviz figures
        run: make graphvizfigures
      - name: Build docs with mkdocs in strict mode
        run: uv run mkdocs build --strict --verbose
      - name: Verify the /latest/ redirect-stub tree covers every built page
        # A stub tree that silently stops covering newly added pages looks
        # identical to a healthy build, so assert coverage, not just presence.
        # See scripts/mkdocs_hooks.py for why this tree exists.
        run: |
          test -f site/version.json
          grep -q 'location.replace' site/404.html
          pages=$(find site -name index.html -not -path 'site/latest/*' | wc -l)
          stubs=$(find site/latest -name index.html | wc -l)
          test "$pages" -eq "$stubs"
